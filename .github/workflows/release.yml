name: Release

# Push a tag like v0.1.0 to build installers for Linux and Windows and publish them
# as a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 keeps the glibc requirement low so the packages run on older distros.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "PiLunch ${{ github.ref_name }}"
          releaseBody: |
            **PiLunch** — an AI code editor for Linux and Windows, built with Rust and TypeScript.

            ### Downloads
            - **Debian / Ubuntu:** `.deb` — `sudo apt install ./PiLunch_*_amd64.deb`
            - **Fedora / RHEL / openSUSE:** `.rpm`
            - **Any Linux:** `.AppImage` — `chmod +x PiLunch_*.AppImage && ./PiLunch_*.AppImage`
            - **Windows 10/11:** `.msi` or `-setup.exe`

            You need an Anthropic API key (console.anthropic.com); the first-run setup walks you through it.
          releaseDraft: false
          prerelease: false
