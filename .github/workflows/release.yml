name: Release

# Builds installers for Linux and Windows and publishes them as a GitHub release
# tagged v<version from tauri.conf.json>. Runs when a v* tag is pushed, when started
# manually, or when a pushed commit's message contains "[release]".
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-22.04 keeps the glibc requirement low so the packages run on older distros.
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[release]')
    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: "PiLunch v__VERSION__"
          releaseBody: |
            **PiLunch** — an AI code editor for Linux and Windows, built with Rust and TypeScript.

            ### Downloads
            - **Debian / Ubuntu:** `.deb` — `sudo apt install ./PiLunch_*_amd64.deb`
            - **Fedora / RHEL / openSUSE:** `.rpm`
            - **Any Linux:** `.AppImage` — `chmod +x PiLunch_*.AppImage && ./PiLunch_*.AppImage`
            - **Windows 10/11:** `.msi` or `-setup.exe`

            ### What's new in 0.2.0
            - **More providers:** OpenAI, Google Gemini and xAI Grok join Anthropic, OpenRouter and local models (Ollama, LM Studio, vLLM, llama.cpp).
            - **Thinking levels for local models:** Off · Low · Normal · Medium · High · XHigh · Ultra · Max. XHigh and above enforce a minimum thinking budget (Max ≈ 16k thinking tokens).
            - **Training traces:** save every run (thinking, tool calls, results) and export a JSONL dataset for fine-tuning.
            - **Usage panel** with daily tokens by model and provider.
            - **Skills** the agent loads and writes itself, **custom tools**, **MCP servers** (stdio + HTTP), **plugins** and **Rust extensions** (`pilunch-extension` crate).
            - **Built-in Firefox browser** the agent can drive, shown live in a Browser panel, plus optional **computer use**.
            - Flatter, gradient-free design.

            Connect a provider in the first-run setup: an API key (Anthropic, OpenAI, Google, xAI, OpenRouter) or a local server.
          releaseDraft: false
          prerelease: false
